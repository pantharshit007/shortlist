# Local development services. Ports bind to 127.0.0.1 so they are not reachable from the network.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resumebuilder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumebuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
